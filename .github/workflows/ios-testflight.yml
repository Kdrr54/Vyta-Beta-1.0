name: Build & Deploy iOS App (TestFlight & IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA & TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      DIST_KEY_PEM: ${{ secrets.DIST_KEY_PEM }}
      DIST_CERT_PEM: ${{ secrets.DIST_CERT_PEM }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm install

      - name: 🔨 Compilation des assets web
        run: npm run build

      - name: 🍏 Synchronisation du projet iOS natif
        run: |
          npx cap sync ios
          node scripts/add_widget_target.cjs

      - name: 🛠️ Vérification de Xcode 16 (iOS 18 SDK requis par App Store Connect)
        run: |
          echo "Versions de Xcode disponibles sur le runner :"
          ls -d /Applications/Xcode* || true
          xcodebuild -version

      - name: 🔑 Configuration de la clé API App Store Connect
        if: ${{ env.APP_STORE_CONNECT_API_KEY != '' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: 🔐 Installation du certificat Apple Distribution et profil dans le Keychain
        if: ${{ env.DIST_CERT_PEM != '' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$DIST_KEY_PEM" > $RUNNER_TEMP/key.pem
          echo "$DIST_CERT_PEM" > $RUNNER_TEMP/cert.pem
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $RUNNER_TEMP/build_pp.mobileprovision

          openssl pkcs12 -export \
            -inkey $RUNNER_TEMP/key.pem \
            -in $RUNNER_TEMP/cert.pem \
            -out $RUNNER_TEMP/dist.p12 \
            -passout pass:"$P12_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import $RUNNER_TEMP/dist.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/build_pp.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cp ios/App/Vyta_Workout_Widget_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "Certificat Apple Distribution et profils installés avec succès !"

      - name: 📦 Compilation de l'archive iOS
        run: |
          cd ios/App
          if [ -n "$DIST_CERT_PEM" ]; then
            echo "Building with Apple Distribution certificate and manual signing..."
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              -destination 'generic/platform=iOS' \
              CODE_SIGN_STYLE="Manual" \
              DEVELOPMENT_TEAM="ZCU3WN2ZW4" \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              CURRENT_PROJECT_VERSION=${{ github.run_number }} \
              archive
          else
            echo "Building unsigned archive for local sideloading..."
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              -destination 'generic/platform=iOS' \
              CURRENT_PROJECT_VERSION=${{ github.run_number }} \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
          fi

      - name: 📲 Génération du fichier Vyta.ipa
        run: |
          cd ios/App
          if [ -f "ExportOptions.plist" ] && [ -n "$DIST_CERT_PEM" ]; then
            echo "Exporting signed App Store / TestFlight IPA..."
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportPath build/Export \
              -exportOptionsPlist ExportOptions.plist
            cp build/Export/*.ipa ../../Vyta.ipa
          else
            mkdir -p Payload
            cp -r build/App.xcarchive/Products/Applications/App.app Payload/Vyta.app
            zip -r Vyta.ipa Payload
            mv Vyta.ipa ../../Vyta.ipa
          fi

      - name: 🚀 Téléversement de l'IPA en artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Vyta-iOS-App
          path: Vyta.ipa
          retention-days: 14

      - name: ✈️ Envoi vers TestFlight
        if: ${{ env.APP_STORE_CONNECT_API_KEY != '' }}
        run: |
          echo "🔍 Inspection des applications enregistrées sur App Store Connect..."
          xcrun altool --list-apps \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --output-format json > apps.json || true
          cat apps.json || true

          APP_ID=$(node -e "
            try {
              const fs = require('fs');
              const raw = fs.readFileSync('apps.json', 'utf8');
              const j = JSON.parse(raw);
              const apps = Array.isArray(j.apps) ? j.apps : (Array.isArray(j.app_list) ? j.app_list : []);
              const match = apps.find(a => (a.bundle_id || a.bundleId) === 'lt.manodrabuziai.fr.ZCU3WN2ZW4') || apps[0];
              console.log(match?.['apple-id'] || match?.apple_id || match?.adam_id || match?.adamId || match?.id || '');
            } catch(e) { console.log(''); }
          ")

          echo "Detected Apple ID: $APP_ID"

          if [ -n "$APP_ID" ]; then
            echo "🚀 Téléversement vers TestFlight avec Apple ID explicite ($APP_ID)..."
            xcrun altool --upload-app \
              -f Vyta.ipa \
              -t ios \
              --apple-id "$APP_ID" \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --show-progress
          else
            echo "🚀 Téléversement vers TestFlight..."
            xcrun altool --upload-app \
              -f Vyta.ipa \
              -t ios \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --show-progress
          fi

      - name: 🧹 Nettoyage du Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
