name: Build & Deploy iOS App (TestFlight & IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA & TestFlight
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installation des dépendances
        run: npm install

      - name: 🔨 Compilation des assets web
        run: npm run build

      - name: 🍏 Synchronisation du projet iOS natif
        run: npx cap sync ios

      - name: 🛠️ Sélection de Xcode 16 (Requis par App Store Connect / iOS 18+)
        run: |
          echo "Versions de Xcode disponibles sur le runner :"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: 🔑 Configuration de la clé API App Store Connect
        if: ${{ env.APP_STORE_CONNECT_API_KEY != '' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: 📦 Compilation de l'archive iOS
        run: |
          cd ios/App
          if [ -n "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "Building with App Store Connect automatic provisioning..."
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              -destination 'generic/platform=iOS' \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM=ZCU3WN2ZW4 \
              CURRENT_PROJECT_VERSION=${{ github.run_number }} \
              archive
          else
            echo "Building unsigned archive for local sideloading..."
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              -destination 'generic/platform=iOS' \
              -allowProvisioningUpdates \
              CURRENT_PROJECT_VERSION=${{ github.run_number }} \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive
          fi

      - name: 📲 Génération du fichier Vyta.ipa
        run: |
          cd ios/App
          if [ -n "$APP_STORE_CONNECT_API_KEY" ]; then
            echo "Exporting signed App Store / TestFlight IPA..."
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportPath build/Export \
              -exportOptionsPlist ExportOptions.plist \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
              -allowProvisioningUpdates
            cp build/Export/*.ipa ../../Vyta.ipa
          else
            mkdir -p Payload
            cp -r build/App.xcarchive/Products/Applications/App.app Payload/Vyta.app
            zip -r Vyta.ipa Payload
            mv Vyta.ipa ../../Vyta.ipa
          fi

      - name: 🚀 Téléversement de l'IPA en artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Vyta-iOS-App
          path: Vyta.ipa
          retention-days: 14

      - name: ✈️ Envoi vers TestFlight
        if: ${{ env.APP_STORE_CONNECT_API_KEY != '' }}
        run: |
          xcrun altool --upload-app \
            -f Vyta.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --show-progress
